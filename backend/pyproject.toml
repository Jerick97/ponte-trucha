[project]
name = "ponte-trucha-backend"
version = "0.1.0"
description = "API serverless de Ponte Trucha Kids"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=ponte_trucha --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa `Depends(...)` como valor por defecto de forma idiomática; no es
# el patrón "argumento mutable por defecto" que B008 busca prevenir.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"
